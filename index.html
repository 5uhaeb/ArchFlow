<!doctype html><html><head><meta charset="utf-8"><title>ArchFlow</title><link rel="stylesheet" href="/style.css"></head><body><div id="title">ArchFlow — Workspace Wiring Utility</div><div id="toolbar"><button id="open">Open</button><input id="folder" placeholder="C:\\path\\to\\project"><button id="new">New File</button><button id="mkdir">New Folder</button><input id="key" type="password" placeholder="API Key"><select id="model"><option>gpt-4o-mini</option><option>gemini-2.0-flash</option></select><select id="constraint"><option value="ADD_AND_REWRITE_NO_DELETE">Preserve Existing Code</option><option value="APPEND_ONLY">Append Only</option><option value="SUGGEST_ONLY">Preview Diff Only</option></select><button id="run">Run Wiring</button><button id="theme">Dark Mode</button></div><main id="workspace"><section id="canvasWrap"><svg id="wires"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0L0 0 0 20" fill="none" stroke="var(--grid)"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="var(--wire)"/></marker></defs><rect width="100%" height="100%" fill="url(#grid)"/></svg></section><section id="editorPane"><b id="fileTitle">No file selected</b><div class="hint">Click a file to edit. Drag output port to input port to wire.</div><div class="editor"><pre class="gutter" id="nums">1</pre><pre class="highlight"><code id="hi"></code></pre><textarea id="code" class="edit" spellcheck="false" placeholder="Select a file..."></textarea></div><button id="save">Save</button></section></main><section id="logbox"><div id="log"></div></section><script>
const $=x=>document.getElementById(x),canvas=$('canvasWrap'),svg=$('wires');let files=[],graph={edges:[],positions:{}},selected=null,edgePick=null,positions={};const api=async(p,d)=>{let r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');return j},folder=()=>$('folder').value.trim(),log=s=>{$('log').textContent+=`[${new Date().toLocaleTimeString()}] ${s}\n`;$('log').scrollTop=1e9},esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function highlight(s){let x=esc(s).replace(/(#[^\n]*)/g,'<i class="tok-comment">$1</i>').replace(/(["'])(?:\\.|(?!\1).)*\1/g,'<i class="tok-string">$&</i>').replace(/\b(def|class|import|from|return|if|else|for|while|async|await|function|const|let|var)\b/g,'<i class="tok-key">$1</i>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<i class="tok-num">$1</i>').replace(/(@\w+)/g,'<i class="tok-deco">$1</i>').replace(/\b([\w]+)(?=\()/g,'<i class="tok-fn">$1</i>');$('hi').innerHTML=x+'\n';$('nums').textContent=Array.from({length:s.split('\n').length},(_,i)=>i+1).join('\n')}
function icon(f){if(f.folder)return '<svg class="icon" viewBox="0 0 36 34"><path fill="#ffdb4d" stroke="#806000" d="M2 7h13l3-4h9l2 4h5v24H2z"/></svg>';let e=f.name.split('.').pop().toLowerCase(),c={py:'#3572a5',js:'#f7df1e',html:'#e44d26',css:'#264de4',json:'#9c27b0',md:'#607d8b'}[e]||'#777';return `<svg class="icon" viewBox="0 0 32 38"><path fill="#fff" stroke="#808080" d="M6 1h16l5 5v31H6z"/><path fill="${c}" d="M9 17h15v13H9z"/><text x="11" y="27" font-size="7" fill="#fff">${e.slice(0,4)}</text></svg>`}
function draw(){[...canvas.querySelectorAll('.node')].forEach(x=>x.remove());files.forEach((f,i)=>{let p=positions[f.name]||{x:25+(i%5)*125,y:30+Math.floor(i/5)*95};positions[f.name]=p;let n=document.createElement('div');n.className='node '+f.status+(selected===f.name?' selected':'');n.style.cssText=`left:${p.x}px;top:${p.y}px`;n.innerHTML=`${f.status==='ok'?'':`<svg class="badge" title="${esc(f.diag)}"><circle cx="7" cy="7" r="7" fill="${f.status==='error'?'#e51400':'#ffcc00'}"/><text x="7" y="11" text-anchor="middle" font-size="11" fill="${f.status==='error'?'white':'black'}">${f.status==='error'?'✕':'!'}</text></svg>`}<span class="port in"></span>${icon(f)}<div class="label" title="${f.name}">${f.name.split('/').pop()}</div><span class="port out"></span>`;n.onclick=e=>{if(!e.target.classList.contains('port')&&!f.folder)select(f.name)};n.onpointerdown=e=>drag(e,n,f.name);n.querySelector('.out').onpointerdown=e=>{e.stopPropagation();if(!f.folder){edgePick=f.name;log('Wire start: '+f.name)}};n.querySelector('.in').onpointerup=e=>{e.stopPropagation();if(edgePick&&!f.folder&&edgePick!==f.name)connect(edgePick,f.name);edgePick=null};canvas.append(n)});wires()}
function wires(){svg.querySelectorAll('line').forEach(x=>x.remove());graph.edges.forEach(e=>{let a=positions[e.source],b=positions[e.target];if(!a||!b)return;let l=document.createElementNS('http://www.w3.org/2000/svg','line');Object.entries({x1:a.x+118,y1:a.y+23,x2:b.x,y2:b.y+23,stroke:'var(--wire)','marker-end':'url(#arrow)'}).forEach(([k,v])=>l.setAttribute(k,v));svg.append(l)})}async function persist(){try{graph=await api('positions',{folder:folder(),name:'',content:JSON.stringify(positions)})}catch(e){log(e.message)}}
function drag(e,n,name){if(e.target.classList.contains('port'))return;let r=canvas.getBoundingClientRect(),ox=e.clientX-r.left-positions[name].x,oy=e.clientY-r.top-positions[name].y;n.setPointerCapture(e.pointerId);n.onpointermove=q=>{positions[name]={x:Math.max(0,q.clientX-r.left-ox),y:Math.max(0,q.clientY-r.top-oy)};n.style.left=positions[name].x+'px';n.style.top=positions[name].y+'px';wires()};n.onpointerup=()=>{n.onpointermove=null;persist()}}
async function select(n){selected=n;$('fileTitle').textContent=n;try{$('code').value=(await api('read',{folder:folder(),name:n})).content;highlight($('code').value);draw()}catch(e){log(e.message)}}async function load(){try{let d=await api('files',{path:folder()});files=d.files;graph=d.graph;positions=graph.positions||{};selected=null;draw();log('Opened workspace: '+folder())}catch(e){log(e.message)}}async function connect(s,t){try{graph=await api('edge',{folder:folder(),source:s,target:t});log(`Edge connected: ${s} -> ${t}`);draw()}catch(e){log(e.message)}}
$('open').onclick=load;$('new').onclick=async()=>{let n=prompt('Relative file path (for example: src/app.js)');if(n)try{await api('new',{folder:folder(),name:n});await load();await select(n);log('Created '+n)}catch(e){log(e.message)}};$('mkdir').onclick=async()=>{let n=prompt('Relative folder path');if(n)try{await api('mkdir',{folder:folder(),name:n});await load();log('Created folder '+n)}catch(e){log(e.message)}};$('save').onclick=async()=>{if(!selected)return log('Select a file first.');try{let d=await api('save',{folder:folder(),name:selected,content:$('code').value});log(`Saved ${selected}: ${d.status} — ${d.diag}`);await load()}catch(e){log(e.message)}};$('code').oninput=()=>highlight($('code').value);$('code').onscroll=()=>{$('hi').parentElement.scrollTop=$('code').scrollTop;$('hi').parentElement.scrollLeft=$('code').scrollLeft;$('nums').scrollTop=$('code').scrollTop};$('code').onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();let t=e.target,s=t.selectionStart;t.value=t.value.slice(0,s)+'    '+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+4;highlight(t.value)}};$('run').onclick=async()=>{let edge=graph.edges.find(e=>e.target===selected)||graph.edges[0];if(!edge)return log('Create an edge or select its target.');try{let d=await api('ai',{folder:folder(),...edge,api_key:$('key').value,model:$('model').value,constraint:$('constraint').value});log(`${d.ok?'Accepted':'Rejected'}: +${d.added} / ~${d.modified}`);log(d.rationale||d.error);if(d.diff)log(d.diff);if(d.written)await select(edge.target)}catch(e){log(e.message)}};$('theme').onclick=()=>{let dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'';localStorage.archflowTheme=dark?'dark':'';$('theme').textContent=dark?'Light Mode':'Dark Mode'};if(localStorage.archflowTheme==='dark')$('theme').click();log('Ready. Open a workspace folder.');
const provider=document.createElement('select');provider.id='provider';['OpenAI','Gemini','Claude','Custom'].forEach(v=>provider.add(new Option(v,v)));$('model').replaceWith(Object.assign(document.createElement('input'),{id:'model',value:'gpt-4o-mini',placeholder:'Model'}));$('toolbar').append(provider);const base=document.createElement('input');base.placeholder='Custom base URL (including /v1)';$('toolbar').append(base);
const originalApi=api;
$('open').onclick=async()=>{try{let d=await api('pick-folder',{});if(d.path){$('folder').value=d.path;await load()}}catch(e){log(e.message)}};
let chosenEdge=null,pending=null,frame=null;
function schedule(){if(!frame)frame=requestAnimationFrame(()=>{frame=null;wires()})}
const oldDraw=draw;draw=function(){let groups=[...new Set(files.map(f=>f.name.includes('/')?f.name.slice(0,f.name.lastIndexOf('/')):'.'))].sort();groups.forEach((g,col)=>{files.filter(f=>(f.name.includes('/')?f.name.slice(0,f.name.lastIndexOf('/')):'.')===g).forEach((f,row)=>positions[f.name]={x:30+col*180,y:60+row*90})});oldDraw();canvas.querySelectorAll('.column').forEach(n=>n.remove());groups.forEach((g,i)=>{let h=document.createElement('b');h.className='column';h.textContent=g;h.style.cssText=`position:absolute;left:${30+i*180}px;top:20px`;canvas.append(h)});canvas.querySelectorAll('.node').forEach((n,i)=>{let f=files[i],p=positions[f.name];n.style.left='0';n.style.top='0';n.style.transform=`translate3d(${p.x}px,${p.y}px,0)`;n.onpointerdown=null;n.querySelector('.out').onpointerdown=e=>{e.stopPropagation();pending=f.name;edgePick=f.name};n.querySelector('.in').onpointerup=async e=>{e.stopPropagation();if(pending&&pending!==f.name)await connect(pending,f.name);pending=null};n.querySelector('.in').onclick=async()=>{if(pending&&pending!==f.name)await connect(pending,f.name);pending=null}})};
wires=function(){svg.querySelectorAll('.wire').forEach(n=>n.remove());graph.edges.forEach((e,i)=>{let a=positions[e.source],b=positions[e.target];if(!a||!b)return;let p=document.createElementNS(svg.namespaceURI,'path'),x=a.x+118,y=a.y+23,tx=b.x,ty=b.y+23,mid=(x+tx)/2;p.setAttribute('d',`M${x} ${y}H${mid}V${ty}H${tx}`);p.setAttribute('class','wire');p.setAttribute('fill','none');p.setAttribute('stroke',chosenEdge===i?'#0054e3':'var(--wire)');p.setAttribute('stroke-width','3');p.setAttribute('marker-end','url(#arrow)');p.style.pointerEvents='stroke';p.onclick=()=>{chosenEdge=i;schedule()};p.oncontextmenu=e=>{e.preventDefault();chosenEdge=i;removeWire()};svg.append(p)})};
async function removeWire(){if(chosenEdge===null)return;graph.edges.splice(chosenEdge,1);chosenEdge=null;await api('graph',{folder:folder(),name:'',content:JSON.stringify({...graph,positions})});schedule()}
document.addEventListener('keydown',e=>{if(e.key==='Delete'&&!['TEXTAREA','INPUT'].includes(e.target.tagName))removeWire()});canvas.onpointermove=e=>{if(!pending)return;let r=canvas.getBoundingClientRect(),p=positions[pending];let line=svg.querySelector('#rubber');if(!line){line=document.createElementNS(svg.namespaceURI,'path');line.id='rubber';svg.append(line)}requestAnimationFrame(()=>{line.setAttribute('d',`M${p.x+118} ${p.y+23}L${e.clientX-r.left} ${e.clientY-r.top}`);line.setAttribute('stroke','var(--wire)');line.setAttribute('fill','none')})};canvas.onpointerup=()=>{svg.querySelector('#rubber')?.remove()};
$('run').onclick=async()=>{let e=graph.edges[chosenEdge]||graph.edges.find(x=>x.target===selected)||graph.edges[0];if(!e)return log('Select a wire.');try{let d=await api('ai',{folder:folder(),...e,api_key:$('key').value,model:$('model').value,provider:provider.value,base_url:base.value,constraint:$('constraint').value});log(JSON.stringify(d));if(d.written)await select(e.target)}catch(e){log(e.message)}};
</script></body></html>
