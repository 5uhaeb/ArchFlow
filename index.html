<!doctype html><html><head><meta charset="utf-8"><title>ArchFlow</title><link rel="stylesheet" href="/style.css"></head><body>
<header>ArchFlow — Workspace Wiring</header><nav id="toolbar"><button id="open">Open</button><input id="folder" placeholder="Workspace path"><button id="new">New File</button><button id="mkdir">New Folder</button><select id="constraint"><option value="ADD_AND_REWRITE_NO_DELETE">Preserve Existing Code</option><option value="APPEND_ONLY">Append Only</option><option value="SUGGEST_ONLY">Preview Diff Only</option></select><button id="run" disabled>Run Wiring</button><button id="theme">Dark Mode</button><details><summary>AI Settings</summary><div class="settings"><label>Provider <select id="provider"><option value="OpenAI">OpenAI</option><option value="Gemini">Google Gemini</option><option value="Claude">Anthropic Claude</option><option value="Custom">Custom compatible API</option></select></label><label>API Key <input id="key" type="password" autocomplete="off"></label><label>Model <select id="model"></select></label><label id="customBase" hidden>Custom Base URL <input id="base" placeholder="https://host/v1"></label><button id="enableAi" disabled>Enable AI</button><span id="aiState" role="status">Enter an API key</span></div></details></nav>
<main><section id="canvas"><div id="stage"><svg id="svg"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="var(--wire)"/></marker></defs><g id="branches"></g><g id="wires"></g><path id="rubber"/></svg><div id="nodes"></div></div><div id="zoom"><button id="minus">−</button><button id="plus">+</button><button id="reset">Reset</button><button id="fit">Fit</button><button id="center">Center Selected</button><span id="scale">100%</span></div><details id="legend"><summary>Connections</summary><div id="legendItems"></div><label>Type <select id="edgeType"></select></label><button id="applyType">Apply to selected wire</button></details><aside id="inspector" hidden></aside><svg id="minimap" viewBox="0 0 180 100"></svg><div id="ghost" hidden></div></section></main><pre id="log"></pre><div id="editorModal" hidden><section id="editorPane" role="dialog" aria-modal="true" aria-labelledby="fileTitle"><div class="editorTitle"><b id="fileTitle">No file selected</b><button id="closeEditor" aria-label="Close editor">×</button></div><div class="editor"><pre id="nums">1</pre><div class="code-stack"><pre id="backdrop" class="code-layer"><code id="highlight"></code></pre><textarea class="code-layer" id="code" wrap="off" spellcheck="false" aria-label="Code editor"></textarea></div></div><div class="editorActions"><span id="editorStatus"></span><button id="save">Save</button></div></section></div><div id="apiError" role="alert" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',canvas=$('canvas');let files=[],graph={edges:[]},collapsed=new Set(),positions={},selected=null,wireSelected=null,wireStart=null,panX=0,panY=0,zoom=1,raf=0,pan=null,lastPointer=null,saveTimer;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MASTER_RE=/("""[\s\S]*?"""|'''[\s\S]*?'''|&quot;&quot;&quot;[\s\S]*?&quot;&quot;&quot;|&#39;&#39;&#39;[\s\S]*?&#39;&#39;&#39;|&quot;(?:\\[\s\S]|(?!&quot;)[^\n])*?&quot;|&#39;(?:\\[\s\S]|(?!&#39;)[^\n])*?&#39;|`(?:\\[\s\S]|[^`])*`)|(#[^\n]*|\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(\b\d+(?:\.\d+)?\b)|(\b(?:def|class|import|from|return|if|else|elif|for|while|async|await|function|const|let|var|try|except|raise|pass|True|False|None|new|throw|export)\b)|(@[\w.]+)|(\b\w+(?=\s*\())/g;
function color(){let code=esc($('code').value);$('highlight').innerHTML=code.replace(MASTER_RE,(m,s,c,n,k,d,f)=>`<span class="tok-${s?'string':c?'comment':n?'number':k?'keyword':d?'decorator':'function'}">${m}</span>`)+'\n';$('nums').textContent=Array.from({length:$('code').value.split('\n').length},(_,i)=>i+1).join('\n');sync()}
function sync(){$('backdrop').scrollTop=$('code').scrollTop;$('backdrop').scrollLeft=$('code').scrollLeft;$('nums').scrollTop=$('code').scrollTop}
function log(s){$('log').textContent+=`[${new Date().toLocaleTimeString()}] ${s}\n`;$('log').scrollTop=1e9}
function showApiError(message){let box=$('apiError');box.textContent=message;box.hidden=false;clearTimeout(window.apiErrorTimer);window.apiErrorTimer=setTimeout(()=>box.hidden=true,9000)}
async function api(p,data){let r;try{r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok){let message=j.detail||'Request failed';showApiError(message);throw Error(message)}return j}catch(error){if(!String(error.message).includes('Request failed'))showApiError(error.message||'Network error. Check your connection and provider settings.');throw error}}
</script><script src="/workspace.js"></script></body></html>
